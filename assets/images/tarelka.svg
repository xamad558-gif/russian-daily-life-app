<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#eff6ff"/>
    <stop offset="100%" stop-color="#f8fafc"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
  </filter>
</defs>
<rect width="720" height="480" rx="36" fill="url(#bg)"/>

<g filter="url(#shadow)">
  <circle cx="360" cy="240" r="138" fill="#ffffff"/>
  <circle cx="360" cy="240" r="105" fill="#eff6ff"/>
  <circle cx="360" cy="240" r="72" fill="#dbeafe"/>
</g>

</svg>